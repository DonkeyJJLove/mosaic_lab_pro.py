name: Repository Hygiene

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require canonical README
        run: test -f README.MD || test -f README.md
      - name: Reject tracked local/generated state
        run: |
          BAD=$(git ls-files | grep -E '(^|/)(\.venv|venv|\.idea|__pycache__)(/|$)|(^|/)\.env\.local$|\.egg-info(/|$)' || true)
          if [ -n "$BAD" ]; then echo "$BAD"; exit 1; fi
      - name: Compile Python source
        run: python -m py_compile mosaic_lab_pro.py
